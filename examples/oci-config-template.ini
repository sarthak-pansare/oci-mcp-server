; Copy to ~/.oci/config and fill in the values from the OCI Console:
;   Avatar -> My profile -> API keys -> Add API key -> Generate API key pair
; Oracle shows a "Configuration file preview" you can paste verbatim — just fix key_file.

[DEFAULT]
user=ocid1.user.oc1..REPLACE_ME
fingerprint=aa:bb:cc:dd:ee:ff:00:11:22:33:44:55:66:77:88:99
tenancy=ocid1.tenancy.oc1..REPLACE_ME
region=us-ashburn-1
key_file=~/.oci/oci_api_key.pem

; Optional: a second profile for a different region or tenant
; Selected via OCI_PROFILE=DEV env var when launching the server.
;
; [DEV]
; user=ocid1.user.oc1..xxxx
; fingerprint=...
; tenancy=ocid1.tenancy.oc1..xxxx
; region=eu-frankfurt-1
; key_file=~/.oci/oci_api_key_dev.pem
