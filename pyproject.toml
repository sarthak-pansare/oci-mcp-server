[project]
name = "oci-mcp-server"
version = "0.1.0"
description = "Model Context Protocol server for Oracle Cloud Infrastructure — universal across Claude Code, Cursor, Codex, Continue, VS Code, Zed and any MCP-aware LLM client."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["oci", "oracle-cloud", "mcp", "model-context-protocol", "llm", "claude", "cursor", "codex", "ai-agents"]
authors = [{ name = "OCI MCP Server contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "mcp[cli]>=1.2.0",
    "oci>=2.130.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
oci-mcp-server = "oci_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/your-username/oci-mcp-server"
Repository = "https://github.com/your-username/oci-mcp-server"
Issues = "https://github.com/your-username/oci-mcp-server/issues"
Changelog = "https://github.com/your-username/oci-mcp-server/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oci_mcp"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # long lines are fine; ruff format handles wrapping

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
